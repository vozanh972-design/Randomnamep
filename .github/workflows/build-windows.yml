name: Build LunexReDown.exe

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.*'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2019_64'

      - name: Set up MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Ninja
        uses: seanmiddleditch/gha-setup-ninja@master

      - name: Configure (CMake)
        run: cmake -S . -B build -G "Ninja" -DCMAKE_BUILD_TYPE=Release
        shell: bash

      - name: Build
        run: cmake --build build --config Release
        shell: bash

      - name: Deploy Qt runtime (windeployqt)
        run: |
          mkdir dist
          copy build\bin\LunexReDown.exe dist\LunexReDown.exe
          windeployqt --release --no-translations dist\LunexReDown.exe
        shell: cmd

      - name: Strip anything that isn't needed to run the app
        # Users only ever receive this dist/ folder (exe + Qt runtime DLLs).
        # No .cpp/.h source, no .pdb debug symbols, no server/ code ships here.
        run: |
          del /q dist\*.pdb 2>nul
          del /q dist\*.lib 2>nul
        shell: cmd

      - name: Upload LunexReDown.exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: LunexReDown-windows-x64
          path: dist/
