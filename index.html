<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cron Job Page</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 50px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        #log {
            text-align: left;
            background: #f4f4f4;
            padding: 20px;
            margin-top: 20px;
            border-radius: 5px;
            max-height: 400px;
            overflow-y: auto;
        }
        .log-entry {
            margin-bottom: 10px;
            padding: 10px;
            background: #fff;
            border-radius: 3px;
        }
        .success {
            border-left: 5px solid #28a745;
        }
        .error {
            border-left: 5px solid #dc3545;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Cron Job đang chạy...</h1>
        <p>Trang này sẽ tự động gọi URL mỗi phút.</p>
        <div>
            <p>URL: <code>https://tainguyenall.kesug.com/cron/suppliers/shopclone7.php?key=pteyI7khGyKkOBco</code></p>
            <p>Thời gian chạy: <span id="timer">0</span> giây</p>
            <p>Số lần đã chạy: <span id="counter">0</span></p>
        </div>
        <div>
            <h3>Log</h3>
            <div id="log"></div>
        </div>
    </div>

    <script>
        // Cấu hình
        const URL = "https://tainguyenall.kesug.com/cron/suppliers/shopclone7.php?key=pteyI7khGyKkOBco";
        const INTERVAL = 60000; // 60 giây

        let counter = 0;
        let startTime = Date.now();

        // Cập nhật timer mỗi giây
        setInterval(() => {
            document.getElementById('timer').textContent = Math.floor((Date.now() - startTime) / 1000);
        }, 1000);

        // Hàm ghi log
        function log(message, type = 'success') {
            const logElement = document.getElementById('log');
            const logEntry = document.createElement('div');
            logEntry.className = `log-entry ${type}`;
            logEntry.innerHTML = `<strong>${new Date().toLocaleTimeString()}</strong>: ${message}`;
            logElement.appendChild(logEntry);
            // Cuộn xuống dưới cùng
            logElement.scrollTop = logElement.scrollHeight;
        }

        // Hàm gọi URL
        function callCron() {
            fetch(URL)
                .then(response => {
                    if (response.ok) {
                        counter++;
                        document.getElementById('counter').textContent = counter;
                        log(`Gọi URL thành công. Lần thứ ${counter}`);
                    } else {
                        log(`Lỗi HTTP: ${response.status}`, 'error');
                    }
                })
                .catch(error => {
                    log(`Lỗi kết nối: ${error.message}`, 'error');
                });
        }

        // Chạy ngay lần đầu
        callCron();

        // Thiết lập interval để chạy mỗi phút
        setInterval(callCron, INTERVAL);

        // Log khởi động
        log('Cron job đã bắt đầu. Sẽ chạy mỗi phút.');
    </script>
</body>
</html>
